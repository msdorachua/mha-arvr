<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>MHA XR Safety Challenge</title>

  <!-- A-Frame from its official Content Delivery Network. No Node.js or build step needed. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#0b1220; }
    #startScreen {
      position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#0b1220,#162238); color:white; text-align:center;
    }
    #startCard {
      width:min(650px,calc(100% - 48px)); padding:40px; border-radius:22px;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin:0 0 12px; font-size:38px; }
    p { font-size:18px; line-height:1.55; color:#dbeafe; }
    button {
      border:0; border-radius:12px; padding:16px 30px; margin-top:15px;
      font-size:19px; font-weight:700; cursor:pointer; background:#22d3ee; color:#06202a;
    }
    #status { margin-top:16px; font-size:14px; color:#cbd5e1; }
    .a-enter-vr, .a-enter-ar { display:none !important; }
  </style>

  <script>
    /* =========================================================
       EASY SETTINGS FOR LEARNERS
       ========================================================= */

    // CHANGE GAME DURATION HERE
    const GAME_DURATION = 60;

    // CHANGE POINTS HERE
    const POINTS_CORRECT = 10;
    const POINTS_WRONG = -5;

    // CHANGE ANSWER CARD SIZE HERE
    const ANSWER_WIDTH = 0.95;
    const ANSWER_HEIGHT = 0.78;

    // CHANGE COLOURS HERE
    const COLOURS = {
      panel: "#172033",
      panelHover: "#23405D",
      correct: "#16A34A",
      wrong: "#DC2626",
      cyan: "#22D3EE",
      yellow: "#FACC15",
      white: "#FFFFFF"
    };

    // CHANGE SHOOTING SOUND HERE
    // These sounds are generated by the browser, so there are no audio files to download.
    const SOUND = {
      shootFrequency: 250,
      correctFrequency: 850,
      wrongFrequency: 150
    };


    /* =========================================================
       QUIZ CONTENT
       Edit this section to create a different workplace quiz.
       ========================================================= */

    const QUESTIONS = [
      {
        question: "A fire is too large to put out safely. What should you do?",
        answers: [
          { label: "Alert others,\ncall 995 and\nactivate the alarm", icon: "alarm", correct: true },
          { label: "Use the lift\nto leave quickly", icon: "lift", correct: false },
          { label: "Go back for\nyour belongings", icon: "bag", correct: false }
        ],
        explanation: "If the fire cannot be fought safely, alert others, call 995 and activate the nearest fire alarm."
      },
      {
        question: "During a fire evacuation, which route should you use?",
        answers: [
          { label: "Exit stairs", icon: "stairs", correct: true },
          { label: "Passenger lift", icon: "lift", correct: false },
          { label: "Stay at your\ndesk", icon: "desk", correct: false }
        ],
        explanation: "Evacuate in an orderly manner via the stairs. Do not use the lift."
      },
      {
        question: "Which number should you call to inform SCDF of a fire?",
        answers: [
          { label: "995", icon: "number995", correct: true },
          { label: "999", icon: "number999", correct: false },
          { label: "1777", icon: "number1777", correct: false }
        ],
        explanation: "Dial 995 to inform the Singapore Civil Defence Force of a fire."
      },
      {
        question: "Which should you NEVER use on burning electrical equipment?",
        answers: [
          { label: "Water", icon: "water", correct: true },
          { label: "Suitable dry\npowder extinguisher", icon: "powder", correct: false },
          { label: "Suitable CO2\nextinguisher", icon: "co2", correct: false }
        ],
        explanation: "Water should never be used on burning electrical equipment."
      },
      {
        question: "Spot the fire-safety problem. Aim at the unsafe item.",
        answers: [
          { label: "Boxes blocking\nthe exit", icon: "blockedExit", correct: true },
          { label: "Chair away\nfrom the exit", icon: "chair", correct: false },
          { label: "Plant away\nfrom the exit", icon: "plant", correct: false }
        ],
        explanation: "Exit routes and access to exits should be kept readily accessible and unobstructed."
      }
    ];


    /* =========================================================
       SIMPLE GENERATED SOUND
       ========================================================= */

    const audio = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      tone(freq, duration=0.07, type="sine", volume=0.045) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },
      shoot() { this.tone(SOUND.shootFrequency, 0.045, "square", 0.025); },
      correct() {
        this.tone(SOUND.correctFrequency, 0.07, "sine", 0.05);
        setTimeout(() => this.tone(SOUND.correctFrequency + 250, 0.09, "sine", 0.045), 70);
      },
      wrong() { this.tone(SOUND.wrongFrequency, 0.12, "sawtooth", 0.035); }
    };


    /* =========================================================
       SMALL HELPERS FOR BUILDING A-FRAME OBJECTS
       ========================================================= */

    function make(tag, attrs = {}) {
      const el = document.createElement(tag);
      Object.entries(attrs).forEach(([name, value]) => el.setAttribute(name, value));
      return el;
    }

    function addText(parent, value, position, width=2.6, color="#FFFFFF", align="center") {
      const text = make("a-text", {
        value,
        position,
        width,
        color,
        align,
        "wrap-count": 24
      });
      parent.appendChild(text);
      return text;
    }

    function addIcon(parent, type) {
      const icon = make("a-entity", { position: "0 0.10 0.055" });
      parent.appendChild(icon);

      if (type === "stairs") {
        for (let i = 0; i < 4; i++) {
          icon.appendChild(make("a-box", {
            width: 0.13 + i * 0.11, height: 0.07, depth: 0.10,
            position: `${-0.16 + i*0.055} ${-0.03 + i*0.075} 0`,
            color: "#E5E7EB"
          }));
        }
      } else if (type === "lift") {
        icon.appendChild(make("a-box", { width:0.34, height:0.34, depth:0.07, color:"#64748B" }));
        addText(icon, "↕", "0 0 0.045", 1.1, "#FFFFFF");
      } else if (type === "desk") {
        icon.appendChild(make("a-box", { width:0.38, height:0.07, depth:0.16, position:"0 0.06 0", color:"#A16207" }));
        icon.appendChild(make("a-box", { width:0.04, height:0.20, depth:0.04, position:"-0.14 -0.07 0", color:"#92400E" }));
        icon.appendChild(make("a-box", { width:0.04, height:0.20, depth:0.04, position:"0.14 -0.07 0", color:"#92400E" }));
      } else if (type === "alarm") {
        icon.appendChild(make("a-box", { width:0.28, height:0.28, depth:0.08, color:"#DC2626" }));
        addText(icon, "!", "0 0 0.05", 1.2, "#FFFFFF");
      } else if (type === "bag") {
        icon.appendChild(make("a-box", { width:0.30, height:0.22, depth:0.10, color:"#B45309" }));
        icon.appendChild(make("a-torus", { radius:0.09, "radius-tubular":0.018, rotation:"90 0 0", position:"0 0.14 0", color:"#D97706" }));
      } else if (type.startsWith("number")) {
        const num = type.replace("number", "");
        addText(icon, num, "0 0 0.03", 2.1, type === "number995" ? "#FACC15" : "#FFFFFF");
      } else if (type === "water") {
        icon.appendChild(make("a-cylinder", { radius:0.16, height:0.25, color:"#2563EB" }));
        addText(icon, "H2O", "0 0.01 0.17", 1.0, "#FFFFFF");
      } else if (type === "powder") {
        icon.appendChild(make("a-cylinder", { radius:0.11, height:0.32, color:"#DC2626" }));
        icon.appendChild(make("a-box", { width:0.15, height:0.035, depth:0.05, position:"0 0.19 0", color:"#111827" }));
        addText(icon, "DRY", "0 0.01 0.115", 0.72, "#FFFFFF");
      } else if (type === "co2") {
        icon.appendChild(make("a-cylinder", { radius:0.11, height:0.32, color:"#DC2626" }));
        icon.appendChild(make("a-cone", { "radius-bottom":0.10, "radius-top":0.045, height:0.16, position:"0.17 0.12 0", rotation:"0 0 -65", color:"#111827" }));
        addText(icon, "CO2", "0 0.01 0.115", 0.72, "#FFFFFF");
      } else if (type === "blockedExit") {
        const door = make("a-box", { width:0.34, height:0.34, depth:0.05, position:"0 0.05 0", color:"#15803D" });
        icon.appendChild(door);
        addText(icon, "EXIT", "0 0.13 0.035", 0.7, "#FFFFFF");
        icon.appendChild(make("a-box", { width:0.18, height:0.13, depth:0.11, position:"-0.08 -0.11 0.08", color:"#A16207" }));
        icon.appendChild(make("a-box", { width:0.18, height:0.13, depth:0.11, position:"0.09 -0.10 0.08", color:"#92400E" }));
      } else if (type === "chair") {
        icon.appendChild(make("a-box", { width:0.25, height:0.05, depth:0.18, color:"#475569" }));
        icon.appendChild(make("a-box", { width:0.25, height:0.24, depth:0.04, position:"0 0.13 -0.07", color:"#64748B" }));
      } else if (type === "plant") {
        icon.appendChild(make("a-cylinder", { radius:0.10, height:0.14, position:"0 -0.10 0", color:"#92400E" }));
        icon.appendChild(make("a-sphere", { radius:0.16, position:"0 0.09 0", color:"#16A34A" }));
      }
    }


    /* =========================================================
       QUIZ GAME MANAGER
       ========================================================= */

    AFRAME.registerComponent("quiz-game", {
      init() {
        this.score = 0;
        this.timeLeft = GAME_DURATION;
        this.currentQuestion = 0;
        this.gameRunning = false;
        this.locked = false;
        this.timer = null;

        this.questionText = document.querySelector("#questionText");
        this.progressText = document.querySelector("#progressText");
        this.scoreText = document.querySelector("#scoreText");
        this.timerText = document.querySelector("#timerText");
        this.feedbackText = document.querySelector("#feedbackText");
        this.feedbackPanel = document.querySelector("#feedbackPanel");
        this.answerArea = document.querySelector("#answerArea");
        this.gameOverPanel = document.querySelector("#gameOverPanel");
        this.gameOverScore = document.querySelector("#gameOverScore");

        const scene = document.querySelector("a-scene");

        scene.addEventListener("enter-vr", () => {
          setTimeout(() => this.startGame(), 400);
        });

        scene.addEventListener("exit-vr", () => {
          this.stopTimer();
          this.gameRunning = false;
          document.querySelector("#startScreen").style.display = "flex";
          document.querySelector("#status").textContent = "Ready to enter mixed reality again.";
        });
      },

      startGame() {
        this.stopTimer();
        this.score = 0;
        this.timeLeft = GAME_DURATION;
        this.currentQuestion = 0;
        this.gameRunning = true;
        this.locked = false;

        this.gameOverPanel.setAttribute("visible", false);
        document.querySelector("#quizRoot").setAttribute("visible", true);
        this.feedbackPanel.setAttribute("visible", false);

        this.updateHUD();
        this.showQuestion();

        this.timer = setInterval(() => {
          if (!this.gameRunning) return;
          this.timeLeft--;
          this.updateHUD();
          if (this.timeLeft <= 0) this.endGame("Time is up!");
        }, 1000);
      },

      stopTimer() {
        if (this.timer) clearInterval(this.timer);
        this.timer = null;
      },

      updateHUD() {
        this.scoreText.setAttribute("value", `Score: ${this.score}`);
        this.timerText.setAttribute("value", `Time: ${this.timeLeft}`);
        this.progressText.setAttribute("value", `Question ${Math.min(this.currentQuestion + 1, QUESTIONS.length)} / ${QUESTIONS.length}`);
      },

      showQuestion() {
        if (!this.gameRunning) return;
        if (this.currentQuestion >= QUESTIONS.length) {
          this.endGame("Challenge complete!");
          return;
        }

        this.locked = false;
        this.feedbackPanel.setAttribute("visible", false);
        const q = QUESTIONS[this.currentQuestion];
        this.questionText.setAttribute("value", q.question);
        this.answerArea.innerHTML = "";

        const positions = [-1.12, 0, 1.12];

        q.answers.forEach((answer, index) => {
          const card = make("a-box", {
            class: "shootable",
            width: ANSWER_WIDTH,
            height: ANSWER_HEIGHT,
            depth: 0.07,
            position: `${positions[index]} 0 0`,
            color: COLOURS.panel,
            "data-answer-index": index
          });

          card.dataset.answerIndex = index;
          card.dataset.disabled = "false";

          // A subtle backing border.
          const border = make("a-box", {
            width: ANSWER_WIDTH + 0.035,
            height: ANSWER_HEIGHT + 0.035,
            depth: 0.025,
            position: "0 0 -0.045",
            color: "#64748B"
          });
          card.appendChild(border);

          addIcon(card, answer.icon);
          addText(card, answer.label, "0 -0.21 0.06", 1.65, "#FFFFFF");

          card.addEventListener("raycaster-intersected", () => {
            if (card.dataset.disabled === "false" && !this.locked) card.setAttribute("color", COLOURS.panelHover);
          });
          card.addEventListener("raycaster-intersected-cleared", () => {
            if (card.dataset.disabled === "false" && !this.locked) card.setAttribute("color", COLOURS.panel);
          });

          this.answerArea.appendChild(card);
        });

        this.updateHUD();
      },

      choose(card) {
        if (!this.gameRunning || this.locked || !card) return;
        if (card.dataset.disabled === "true") return;

        const q = QUESTIONS[this.currentQuestion];
        const index = Number(card.dataset.answerIndex);
        const answer = q.answers[index];

        if (answer.correct) {
          this.locked = true;
          this.score += POINTS_CORRECT;
          card.setAttribute("color", COLOURS.correct);
          audio.correct();
          this.showFeedback(`CORRECT   +${POINTS_CORRECT}\n${q.explanation}`, COLOURS.correct);
          this.updateHUD();

          setTimeout(() => {
            if (!this.gameRunning) return;
            this.currentQuestion++;
            this.showQuestion();
          }, 2600);

        } else {
          this.score += POINTS_WRONG;
          card.dataset.disabled = "true";
          card.classList.remove("shootable");
          card.setAttribute("color", COLOURS.wrong);
          audio.wrong();
          this.showFeedback(`NOT QUITE   ${POINTS_WRONG}\nTry another answer.`, COLOURS.wrong);
          this.updateHUD();

          setTimeout(() => {
            if (this.gameRunning && !this.locked) this.feedbackPanel.setAttribute("visible", false);
          }, 1400);
        }
      },

      showFeedback(message, colour) {
        this.feedbackPanel.setAttribute("visible", true);
        this.feedbackPanel.setAttribute("color", colour);
        this.feedbackText.setAttribute("value", message);
      },

      endGame(reason) {
        if (!this.gameRunning) return;
        this.gameRunning = false;
        this.locked = true;
        this.stopTimer();

        document.querySelector("#quizRoot").setAttribute("visible", false);
        this.gameOverPanel.setAttribute("visible", true);
        document.querySelector("#gameOverReason").setAttribute("value", reason);
        this.gameOverScore.setAttribute("value", `Your Score: ${this.score}`);
      }
    });


    /* =========================================================
       RIGHT-HAND META QUEST CONTROLLER
       ========================================================= */

    AFRAME.registerComponent("quiz-shooter", {
      init() {
        this.el.addEventListener("triggerdown", () => this.shoot());

        // Press A after Game Over to restart.
        this.el.addEventListener("abuttondown", () => {
          const game = document.querySelector("#gameManager").components["quiz-game"];
          if (game && !game.gameRunning) game.startGame();
        });
      },

      shoot() {
        const game = document.querySelector("#gameManager").components["quiz-game"];
        if (!game || !game.gameRunning || game.locked) return;

        audio.shoot();

        // The raycaster points forward from the right controller.
        // Only elements with class="shootable" are tested.
        const raycaster = this.el.components.raycaster;
        if (!raycaster || !raycaster.intersections || raycaster.intersections.length === 0) return;

        const intersection = raycaster.intersections[0];
        const hit = intersection.object && intersection.object.el;

        if (hit && hit.classList.contains("shootable")) {
          game.choose(hit);
        }
      }
    });


    /* =========================================================
       NORMAL WEB PAGE "ENTER XR" BUTTON
       ========================================================= */

    window.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("a-scene");
      const button = document.querySelector("#enterXRButton");
      const status = document.querySelector("#status");
      const startScreen = document.querySelector("#startScreen");

      button.addEventListener("click", async () => {
        audio.init();

        if (!window.isSecureContext) {
          status.textContent = "This page must be hosted using HTTPS before WebXR can start.";
          return;
        }

        if (!navigator.xr) {
          status.textContent = "WebXR is not available in this browser. Open the page in Meta Quest Browser.";
          return;
        }

        try {
          const supported = await navigator.xr.isSessionSupported("immersive-ar");

          if (!supported) {
            status.textContent = "This browser is not reporting immersive mixed-reality support.";
            return;
          }

          status.textContent = "Entering mixed reality...";
          await scene.enterAR();
          startScreen.style.display = "none";
        } catch (err) {
          console.error(err);
          status.textContent = "Could not start mixed reality. Check HTTPS and headset browser permissions.";
        }
      });
    });
  </script>
</head>

<body>

  <!-- Normal browser start screen -->
  <div id="startScreen">
    <div id="startCard">
      <h1>MHA XR Safety Challenge</h1>
      <p>
        Put on your headset, enter mixed reality, read each safety question,
        aim at the correct answer and pull the right controller trigger.
      </p>
      <p><strong>Correct: +10 &nbsp;&nbsp; Wrong: -5</strong></p>
      <button id="enterXRButton">Enter Mixed Reality</button>
      <div id="status">Best experienced using Meta Quest Browser over HTTPS.</div>
    </div>
  </div>


  <a-scene
    xr-mode-ui="XRMode: ar"
    renderer="alpha: true; colorManagement: true; antialias: true"
    background="transparent: true"
    webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor"
  >

    <a-entity id="gameManager" quiz-game></a-entity>

    <!-- Stationary learner: no thumbstick locomotion -->
    <a-camera id="camera" wasd-controls-enabled="false"></a-camera>

    <!-- Left controller is visible but is not used to answer -->
    <a-entity id="leftController" meta-touch-controls="hand: left"></a-entity>

    <!-- Right controller: visible laser + Quest trigger -->
    <a-entity
      id="rightController"
      meta-touch-controls="hand: right"
      raycaster="objects: .shootable; far: 6; showLine: true; lineColor: #22D3EE; lineOpacity: 0.95"
      quiz-shooter
    ></a-entity>


    <!-- ======================
         MAIN QUIZ
         ====================== -->
    <a-entity id="quizRoot">

      <!-- Header panel -->
      <a-entity position="0 2.25 -2.55">
        <a-box width="3.65" height="0.78" depth="0.055" color="#0F172A" opacity="0.94"></a-box>

        <a-text
          id="questionText"
          value="Question"
          position="0 0.08 0.035"
          width="3.2"
          align="center"
          color="#FFFFFF"
          wrap-count="48"
        ></a-text>

        <a-text
          id="progressText"
          value="Question 1 / 5"
          position="-1.55 -0.27 0.035"
          width="1.6"
          align="left"
          color="#93C5FD"
        ></a-text>

        <a-text
          id="scoreText"
          value="Score: 0"
          position="0.55 -0.27 0.035"
          width="1.5"
          align="left"
          color="#FFFFFF"
        ></a-text>

        <a-text
          id="timerText"
          value="Time: 60"
          position="1.22 -0.27 0.035"
          width="1.5"
          align="left"
          color="#FACC15"
        ></a-text>
      </a-entity>

      <!-- Dynamic answer cards -->
      <a-entity id="answerArea" position="0 1.22 -2.55"></a-entity>

      <!-- Feedback -->
      <a-box
        id="feedbackPanel"
        position="0 0.48 -2.45"
        width="3.0"
        height="0.48"
        depth="0.04"
        color="#16A34A"
        opacity="0.96"
        visible="false"
      >
        <a-text
          id="feedbackText"
          value=""
          position="0 0 0.03"
          width="2.7"
          align="center"
          color="#FFFFFF"
          wrap-count="48"
        ></a-text>
      </a-box>

    </a-entity>


    <!-- ======================
         GAME OVER PANEL
         ====================== -->
    <a-entity id="gameOverPanel" position="0 1.5 -2.3" visible="false">
      <a-box width="2.8" height="1.55" depth="0.06" color="#111827" opacity="0.96"></a-box>

      <a-text
        value="CHALLENGE COMPLETE"
        position="0 0.48 0.04"
        width="3.2"
        align="center"
        color="#FACC15"
      ></a-text>

      <a-text
        id="gameOverReason"
        value=""
        position="0 0.17 0.04"
        width="2.4"
        align="center"
        color="#BFDBFE"
      ></a-text>

      <a-text
        id="gameOverScore"
        value="Your Score: 0"
        position="0 -0.10 0.04"
        width="2.8"
        align="center"
        color="#FFFFFF"
      ></a-text>

      <a-text
        value="Press A on the right controller to restart"
        position="0 -0.45 0.04"
        width="2.4"
        align="center"
        color="#67E8F9"
        wrap-count="38"
      ></a-text>
    </a-entity>

  </a-scene>
</body>
</html>
