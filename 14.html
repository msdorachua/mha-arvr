/* =========================================================
   GENERATED SOUND
   ========================================================= */

const audio = {
  ctx: null,

  init() {
    if (!this.ctx) {
      this.ctx =
        new (window.AudioContext || window.webkitAudioContext)();
    }

    if (this.ctx.state === "suspended") {
      this.ctx.resume();
    }
  },

  tone(frequency, duration = 0.07, type = "sine", volume = 0.04) {
    this.init();

    const oscillator = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
      volume,
      this.ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      this.ctx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(this.ctx.destination);

    oscillator.start();
    oscillator.stop(
      this.ctx.currentTime + duration
    );
  },

  shoot() {
    this.tone(
      SOUND.shoot,
      0.045,
      "square",
      0.025
    );
  },

  correct() {
    this.tone(
      SOUND.correct,
      0.07,
      "sine",
      0.05
    );

    setTimeout(() => {
      this.tone(
        SOUND.correct + 250,
        0.09,
        "sine",
        0.045
      );
    }, 60);
  },

  wrong() {
    this.tone(
      SOUND.wrong,
      0.12,
      "sawtooth",
      0.035
    );
  },

  explode() {
    this.tone(
      SOUND.explode,
      0.20,
      "sawtooth",
      0.05
    );
  }
};

function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function shuffledQuestions() {
  const copy = [...QUESTIONS];

  for (let i = copy.length - 1; i > 0; i--) {
    const j =
      Math.floor(Math.random() * (i + 1));

    [copy[i], copy[j]] =
      [copy[j], copy[i]];
  }

  return copy;
}

/* =========================================================
   XR HIGHLIGHT
   ========================================================= */

let currentXRHighlight = null;

function clearCurrentXRHighlight() {
  if (
    currentXRHighlight &&
    currentXRHighlight.parentNode
  ) {
    currentXRHighlight.parentNode.removeChild(
      currentXRHighlight
    );
  }

  currentXRHighlight = null;
}

function showXRHighlight(
  holder,
  width,
  height
) {
  clearCurrentXRHighlight();

  const outline =
    document.createElement("a-box");

  outline.setAttribute(
    "width",
    width
  );

  outline.setAttribute(
    "height",
    height
  );

  outline.setAttribute(
    "depth",
    "0.012"
  );

  outline.setAttribute(
    "position",
    "0 0 0.075"
  );

  outline.setAttribute(
    "material",
    "color: #22D3EE; opacity: 0.95; transparent: true; wireframe: true"
  );

  holder.appendChild(outline);

  currentXRHighlight = outline;
}

function attachAimAssist(
  holder,
  visibleCard,
  answerIndex
) {
  const hitbox =
    document.createElement("a-box");

  hitbox.classList.add("shootable");

  hitbox.dataset.index =
    answerIndex;

  hitbox.setAttribute(
    "width",
    XR_HITBOX_WIDTH
  );

  hitbox.setAttribute(
    "height",
    XR_HITBOX_HEIGHT
  );

  hitbox.setAttribute(
    "depth",
    XR_HITBOX_DEPTH
  );

  hitbox.setAttribute(
    "material",
    "opacity: 0.001; transparent: true; depthWrite: false"
  );

  holder.appendChild(hitbox);

  hitbox.addEventListener(
    "raycaster-intersected",
    () => {
      showXRHighlight(
        holder,
        XR_TARGET_WIDTH + 0.05,
        XR_TARGET_HEIGHT + 0.05
      );

      if (visibleCard) {
        visibleCard.setAttribute(
          "scale",
          "1.05 1.05 1.05"
        );
      }
    }
  );

  hitbox.addEventListener(
    "raycaster-intersected-cleared",
    () => {
      if (
        currentXRHighlight &&
        currentXRHighlight.parentNode === holder
      ) {
        clearCurrentXRHighlight();
      }

      if (visibleCard) {
        visibleCard.setAttribute(
          "scale",
          "1 1 1"
        );
      }
    }
  );

  return hitbox;
}

    );

    });

/* =========================================================
   XR 3D MODEL ANSWERS
   ========================================================= */

function createXRModelAnswer(answer) {
  const holder =
    document.createElement("a-entity");

  const hitbox =
    document.createElement("a-box");

  hitbox.classList.add(
    "shootable"
  );

  hitbox.setAttribute(
    "width",
    XR_HITBOX_WIDTH
  );

  hitbox.setAttribute(
    "height",
    XR_HITBOX_HEIGHT
  );

  hitbox.setAttribute(
    "depth",
    XR_HITBOX_DEPTH
  );

  hitbox.setAttribute(
    "material",
    "opacity: 0.001; transparent: true"
  );

  holder.appendChild(hitbox);

  const model =
    document.createElement("a-entity");

  model.setAttribute(
    "gltf-model",
    MODEL_FILES[answer.model]
  );

  model.setAttribute(
    "scale",
    "0.115 0.115 0.115"
  );

  model.setAttribute(
    "position",
    "0 0 0.02"
  );

  model.setAttribute(
    "log-gltf-materials",
    ""
  );

  /*
   * IMPORTANT:
   * Do not set a material or colour on the GLB here.
   * This preserves the model's embedded textures/materials.
   */

  holder.appendChild(model);

  hitbox.addEventListener(
    "raycaster-intersected",
    () => {
      showXRHighlight(
        holder,
        XR_TARGET_WIDTH + 0.08,
        XR_TARGET_HEIGHT + 0.12
      );

      model.setAttribute(
        "scale",
        "0.125 0.125 0.125"
      );
    }
  );

  hitbox.addEventListener(
    "raycaster-intersected-cleared",
    () => {
      if (
        currentXRHighlight &&
        currentXRHighlight.parentNode === holder
      ) {
        clearCurrentXRHighlight();
      }

      model.setAttribute(
        "scale",
        "0.115 0.115 0.115"
      );
    }
  );

  const label =
    document.createElement("a-text");

  label.setAttribute(
    "value",
    answer.label
  );

  label.setAttribute(
    "align",
    "center"
  );

  label.setAttribute(
    "position",
    "0 -0.15 0.08"
  );

  label.setAttribute(
    "width",
    "0.48"
  );

  label.setAttribute(
    "wrap-count",
    "18"
  );

  holder.appendChild(label);

  return {
    holder,
    hitbox
  };
}

/* =========================================================
   MODE DETECTION
   ========================================================= */

function isTouchDevice() {
  return (
    navigator.maxTouchPoints > 0 ||
    window.matchMedia(
      "(pointer: coarse)"
    ).matches
  );
}

async function detectMode() {
  const status =
    document.querySelector(
      "#modeStatus"
    );

  const touch =
    isTouchDevice();

  if (touch) {
    document.querySelector(
      "#mobileButton"
    ).style.display =
      "inline-block";
  }

  if (!window.isSecureContext) {
    status.textContent =
      "This page is not using HTTPS, so WebXR cannot start. Desktop and mobile modes are still available.";

    document.querySelector(
      "#pcButton"
    ).style.display =
      "inline-block";

    return;
  }

  if (navigator.xr) {
    try {
      const supported =
        await navigator.xr.isSessionSupported(
          "immersive-ar"
        );

      if (supported) {
        document.querySelector(
          "#modeTitle"
        ).textContent =
          "MHA XR Safety Challenge";

        document.querySelector(
          "#modeDescription"
        ).textContent =
          "Mixed-reality mode detected. Put on your headset, aim with the right controller and pull the trigger.";

        document.querySelector(
          "#xrButton"
        ).style.display =
          "inline-block";

        document.querySelector(
          "#pcButton"
        ).style.display =
          "inline-block";

        status.textContent =
          "WebXR mixed reality is available.";

        return;
      }
    }

    catch (error) {
      console.warn(
        "WebXR capability check failed:",
        error
      );
    }
  }

  document.querySelector(
    "#modeTitle"
  ).textContent =
    "MHA Safety Challenge";

  document.querySelector(
    "#modeDescription"
  ).textContent =
    touch
      ? "Touch device detected. Use Mobile Touch Mode to drag the cyan aiming crosshair and tap SHOOT."
      : "WebXR is not available in this browser. Use the desktop version.";

  document.querySelector(
    "#pcButton"
  ).style.display =
    "inline-block";

  status.textContent =
    touch
      ? "Mobile touch mode is available."
      : "Desktop mode detected.";
}

/* =========================================================
   MOBILE TOUCH AIMING
   ========================================================= */

let mobileMode = false;
let currentMobileTarget = null;
let mobileAimFrame = null;

function clearMobileAim() {
  document
    .querySelectorAll(
      ".pcTarget.mobile-aim"
    )
    .forEach((element) => {
      element.classList.remove(
        "mobile-aim"
      );
    });

  currentMobileTarget = null;

  const status =
    document.querySelector(
      "#mobileAimStatus"
    );

  if (status) {
    status.textContent =
      "No target selected";
  }
}

function setMobileCrosshairFromClient(
  clientX,
  clientY
) {
  if (!mobileMode) {
    return;
  }

  const arena =
    document.querySelector(
      "#pcArena"
    );

  const crosshair =
    document.querySelector(
      "#mobileCrosshair"
    );

  const rect =
    arena.getBoundingClientRect();

  const x =
    Math.max(
      18,
      Math.min(
        rect.width - 18,
        clientX - rect.left
      )
    );

  const y =
    Math.max(
      18,
      Math.min(
        rect.height - 100,
        clientY - rect.top
      )
    );

  crosshair.style.left =
    `${x}px`;

  crosshair.style.top =
    `${y}px`;

  updateMobileRay();
  updateMobileAim();
}

function updateMobileRay() {
  if (!mobileMode) {
    return;
  }

  const arena =
    document.querySelector(
      "#pcArena"
    );

  const crosshair =
    document.querySelector(
      "#mobileCrosshair"
    );

  const ray =
    document.querySelector(
      "#mobileRay"
    );

  const arenaRect =
    arena.getBoundingClientRect();

  const crosshairRect =
    crosshair.getBoundingClientRect();

  const endX =
    (
      crosshairRect.left +
      crosshairRect.width / 2
    ) -
    arenaRect.left;

  const endY =
    (
      crosshairRect.top +
      crosshairRect.height / 2
    ) -
    arenaRect.top;

  const startX =
    arenaRect.width / 2;

  const startY =
    Math.max(
      0,
      arenaRect.height - 38
    );

  const dx =
    endX - startX;

  const dy =
    endY - startY;

  const length =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  const angle =
    Math.atan2(
      dy,
      dx
    ) *
    180 /
    Math.PI;

  ray.style.left =
    `${startX}px`;

  ray.style.top =
    `${startY}px`;

  ray.style.width =
    `${length}px`;

  ray.style.transform =
    `rotate(${angle}deg)`;
}

function updateMobileAim() {
  if (
    !mobileMode ||
    !pc.running
  ) {
    return;
  }

  const crosshair =
    document.querySelector(
      "#mobileCrosshair"
    );

  const crosshairRect =
    crosshair.getBoundingClientRect();

  const cx =
    crosshairRect.left +
    crosshairRect.width / 2;

  const cy =
    crosshairRect.top +
    crosshairRect.height / 2;

  let bestTarget = null;
  let bestDistance = Infinity;

  document
    .querySelectorAll(
      ".pcTarget"
    )
    .forEach((target) => {
      if (
        target.dataset.disabled ===
        "true"
      ) {
        return;
      }

      const rect =
        target.getBoundingClientRect();

      /*
       * Slightly forgiving aim area.
       * This makes mobile aiming easier
       * without creating huge overlapping
       * touch zones.
       */
      const padX = 12;
      const padY = 10;

      const inside =
        cx >= rect.left - padX &&
        cx <= rect.right + padX &&
        cy >= rect.top - padY &&
        cy <= rect.bottom + padY;

      if (!inside) {
        return;
      }

      const targetX =
        (
          rect.left +
          rect.right
        ) / 2;

      const targetY =
        (
          rect.top +
          rect.bottom
        ) / 2;

      const distance =
        (
          targetX - cx
        ) *
        (
          targetX - cx
        ) +
        (
          targetY - cy
        ) *
        (
          targetY - cy
        );

      if (
        distance <
        bestDistance
      ) {
        bestDistance =
          distance;

        bestTarget =
          target;
      }
    });

  if (
    bestTarget !==
    currentMobileTarget
  ) {
    document
      .querySelectorAll(
        ".pcTarget.mobile-aim"
      )
      .forEach((element) => {
        element.classList.remove(
          "mobile-aim"
        );
      });

    currentMobileTarget =
      bestTarget;

    if (bestTarget) {
      bestTarget.classList.add(
        "mobile-aim"
      );
    }

    const status =
      document.querySelector(
        "#mobileAimStatus"
      );

    if (status) {
      status.textContent =
        bestTarget
          ? "Target locked - tap SHOOT"
          : "No target selected";
    }
  }
}

function startMobileAimLoop() {
  cancelAnimationFrame(
    mobileAimFrame
  );

  const loop = () => {
    if (
      mobileMode &&
      pc.running
    ) {
      updateMobileAim();
      updateMobileRay();

      mobileAimFrame =
        requestAnimationFrame(
          loop
        );
    }
  };

  mobileAimFrame =
    requestAnimationFrame(
      loop
    );
}

function stopMobileAimLoop() {
  cancelAnimationFrame(
    mobileAimFrame
  );

  mobileAimFrame = null;

  clearMobileAim();
}

/* =========================================================
   DESKTOP / MOBILE GAME
   ========================================================= */

const pc = {
  score: 0,
  timeLeft: GAME_DURATION,
  q: 0,
  running: false,
  locked: false,
  timer: null,
  fallTimer: null,
  questionOrder: [],
  startTime: null,

  start(mode = "desktop") {
    audio.init();

    mobileMode =
      mode === "mobile";

    document.body.classList.toggle(
      "mobile-mode",
      mobileMode
    );

    document.querySelector(
      "#mobileControls"
    ).style.display =
      mobileMode
        ? "block"
        : "none";

    clearMobileAim();

    document.querySelector(
      "#modeScreen"
    ).style.display =
      "none";

    document.querySelector(
      "a-scene"
    ).style.display =
      "none";

    document.querySelector(
      "#pcGame"
    ).style.display =
      "block";

    this.score = 0;
    this.timeLeft = GAME_DURATION;
    this.q = 0;
    this.running = true;
    this.locked = false;

    this.startTime =
      performance.now();

    this.questionOrder =
      shuffledQuestions();

    this.updateHud();
    this.showQuestion();

    if (mobileMode) {
      startMobileAimLoop();
    }

    else {
      stopMobileAimLoop();
    }

    clearInterval(
      this.timer
    );

    this.timer =
      setInterval(
        () => {
          if (!this.running) {
            return;
          }

          this.timeLeft--;

          this.updateHud();

          if (
            this.timeLeft <= 0
          ) {
            this.end(
              "Time is up!"
            );
          }
        },
        1000
      );
  },

  updateHud() {
    document.querySelector(
      "#pcScore"
    ).textContent =
      `Score: ${this.score}`;

    document.querySelector(
      "#pcTime"
    ).textContent =
      `Time: ${this.timeLeft}`;

    const total =
      this.questionOrder.length ||
      QUESTIONS.length;

    document.querySelector(
      "#pcProgress"
    ).textContent =
      `Question ${Math.min(this.q + 1, total)} / ${total}`;
  },

  showQuestion() {
    if (!this.running) {
      return;
    }

    if (
      this.q >=
      this.questionOrder.length
    ) {
      this.end(
        "Challenge complete!"
      );

      return;
    }

    this.locked = false;

    clearTimeout(
      this.fallTimer
    );

    const arena =
      document.querySelector(
        "#pcArena"
      );

    arena.innerHTML = "";

    clearMobileAim();

    const question =
      this.questionOrder[this.q];

    document.querySelector(
      "#pcQuestion"
    ).textContent =
      question.question;

    document.querySelector(
      "#pcFeedback"
    ).style.display =
      "none";

    /*
     * Three broad starting areas are
     * shuffled every question.
     */
    const xSlots =
      [20, 50, 80];

    for (
      let i = xSlots.length - 1;
      i > 0;
      i--
    ) {
      const j =
        Math.floor(
          Math.random() *
          (i + 1)
        );

      [
        xSlots[i],
        xSlots[j]
      ] = [
        xSlots[j],
        xSlots[i]
      ];
    }

    const arrivals = [];

    question.answers.forEach(
      (answer, index) => {
        const target =
          document.createElement(
            "div"
          );

        target.className =
          "pcTarget";

        target.dataset.index =
          index;

        target.style.width =
          `${PC_TARGET_WIDTH}px`;

        target.style.height =
          `${PC_TARGET_HEIGHT}px`;

        const startPercent =
          Math.max(
            10,
            Math.min(
              90,
              xSlots[index] +
              randomBetween(
                -8,
                8
              )
            )
          );

        target.style.left =
          `calc(${startPercent}% - ${PC_TARGET_WIDTH / 2}px)`;

        target.style.top =
          `-${PC_TARGET_HEIGHT + 20}px`;

        target.innerHTML =
          `
          <div class="pcIcon">
            ${answer.icon}
          </div>

          <div>
            ${answer.label.replace(/\n/g, "<br>")}
          </div>

          ${
            question.useModels
              ? '<div style="font-size:10px;margin-top:3px;color:#93c5fd">3D MODEL</div>'
              : ""
          }
          `;

        if (!mobileMode) {
          target.addEventListener(
            "click",
            () => {
              this.choose(
                index,
                target
              );
            }
          );
        }

        else {
          /*
           * The target itself does not receive
           * touch events in Mobile Aim Mode.
           * The crosshair and SHOOT button are
           * used instead.
           */
          target.style.pointerEvents =
            "none";
        }

        arena.appendChild(
          target
        );

        const delay =
          randomBetween(
            0,
            MAX_DROP_DELAY_SECONDS
          );

        const duration =
          randomBetween(
            MIN_FALL_SECONDS,
            MAX_FALL_SECONDS
          );

        arrivals.push(
          delay + duration
        );

        setTimeout(
          () => {
            if (
              !this.running ||
              this.locked
            ) {
              return;
            }

            target.style.transition =
              `top ${duration}s linear, ` +
              `background 0.12s, ` +
              `transform 0.12s`;

            target.style.top =
              `calc(100% - ${PC_TARGET_HEIGHT + 12}px)`;
          },
          delay * 1000
        );
      }
    );

    /*
     * Question expires when the
     * fastest answer reaches the bottom.
     */
    this.fallTimer =
      setTimeout(
        () => {
          this.missed();
        },
        Math.min(
          ...arrivals
        ) * 1000
      );

    this.updateHud();
  },

  choose(index, element) {
    if (
      !this.running ||
      this.locked
    ) {
      return;
    }

    const question =
      this.questionOrder[this.q];

    const answer =
      question.answers[index];

    if (answer.correct) {
      this.locked = true;

      clearTimeout(
        this.fallTimer
      );

      this.score +=
        POINTS_CORRECT;

      element.style.background =
        COLOURS.correct;

      audio.correct();

      this.feedback(
        `CORRECT +${POINTS_CORRECT} — ${question.explanation}`,
        COLOURS.correct
      );

      this.updateHud();

      setTimeout(
        () => {
          this.q++;
          this.showQuestion();
        },
        1800
      );
    }

    else {
      this.score +=
        POINTS_WRONG;

      element.dataset.disabled =
        "true";

      element.classList.remove(
        "mobile-aim"
      );

      element.style.background =
        COLOURS.wrong;

      element.style.pointerEvents =
        "none";

      audio.wrong();

      if (
        currentMobileTarget ===
        element
      ) {
        clearMobileAim();
      }

      this.feedback(
        `WRONG ${POINTS_WRONG} — try another target.`,
        COLOURS.wrong
      );

      this.updateHud();
    }
  },

  missed() {
    if (
      !this.running ||
      this.locked
    ) {
      return;
    }

    this.locked = true;

    this.score +=
      POINTS_MISSED;

    audio.explode();

    this.updateHud();

    const arena =
      document.querySelector(
        "#pcArena"
      );

    const boom =
      document.createElement(
        "div"
      );

    boom.className =
      "explosion";

    boom.style.left =
      "50%";

    boom.style.top =
      "82%";

    arena.appendChild(
      boom
    );

    this.feedback(
      `TOO SLOW ${POINTS_MISSED} — the targets reached the ground.`,
      COLOURS.wrong
    );

    setTimeout(
      () => {
        this.q++;
        this.showQuestion();
      },
      1100
    );
  },

  feedback(message, colour) {
    const feedback =
      document.querySelector(
        "#pcFeedback"
      );

    feedback.textContent =
      message;

    feedback.style.background =
      colour;

    feedback.style.display =
      "block";
  },

  stop() {
    if (!this.running) {
      return;
    }

    this.end(
      "Game stopped."
    );
  },

  end(reason) {
    this.running = false;

    clearInterval(
      this.timer
    );

    clearTimeout(
      this.fallTimer
    );

    if (mobileMode) {
      stopMobileAimLoop();
    }

    clearCurrentXRHighlight();

    const elapsed =
      this.startTime
        ? Math.max(
            0,
            Math.round(
              (
                performance.now() -
                this.startTime
              ) /
              1000
            )
          )
        : 0;

    document.querySelector(
      "#pcGameOverText"
    ).textContent =
      `${reason} Your Score: ${this.score} | Time Taken: ${elapsed} seconds`;

    document.querySelector(
      "#pcGameOver"
    ).style.display =
      "flex";
  }
};

/* =========================================================
   GLB MATERIAL DEBUGGING
   ========================================================= */

AFRAME.registerComponent(
  "log-gltf-materials",
  {
    init() {
      this.el.addEventListener(
        "model-loaded",
        () => {
          const object =
            this.el.getObject3D(
              "mesh"
            );

          if (!object) {
            return;
          }

          object.traverse(
            (node) => {
              if (
                !node.isMesh ||
                !node.material
              ) {
                return;
              }

              const materials =
                Array.isArray(
                  node.material
                )
                  ? node.material
                  : [node.material];

              materials.forEach(
                (material) => {
                  console.log(
                    "GLB material loaded:",
                    {
                      mesh:
                        node.name,

                      material:
                        material.name,

                      color:
                        material.color
                          ? "#" +
                            material.color.getHexString()
                          : "n/a",

                      hasMap:
                        Boolean(
                          material.map
                        ),

                      metalness:
                        material.metalness,

                      roughness:
                        material.roughness
                    }
                  );
                }
              );
            }
          );
        }
      );
    }
  }
);

/* =========================================================
   WEBXR GAME
   ========================================================= */

AFRAME.registerComponent(
  "xr-quiz-game",
  {
    init() {
      this.score = 0;
      this.timeLeft = GAME_DURATION;
      this.q = 0;
      this.running = false;
      this.locked = false;
      this.timer = null;
      this.fallTimer = null;
      this.questionOrder = [];
      this.startTime = null;

      this.answerArea =
        document.querySelector(
          "#xrAnswerArea"
        );

      this.feedback =
        document.querySelector(
          "#xrFeedback"
        );

      const scene =
        document.querySelector(
          "a-scene"
        );

      scene.addEventListener(
        "enter-vr",
        () => {
          setTimeout(
            () => {
              this.start();
            },
            350
          );
        }
      );
    },

    start() {
      clearInterval(
        this.timer
      );

      clearTimeout(
        this.fallTimer
      );

      this.score = 0;
      this.timeLeft = GAME_DURATION;
      this.q = 0;
      this.running = true;
      this.locked = false;

      this.startTime =
        performance.now();

      this.questionOrder =
        shuffledQuestions();

      document.querySelector(
        "#xrGameOver"
      ).setAttribute(
        "visible",
        false
      );

      document.querySelector(
        "#xrQuizRoot"
      ).setAttribute(
        "visible",
        true
      );

      this.updateHud();

      this.showQuestion();

      this.timer =
        setInterval(
          () => {
            if (!this.running) {
              return;
            }

            this.timeLeft--;

            this.updateHud();

            if (
              this.timeLeft <= 0
            ) {
              this.end(
                "Time is up!"
              );
            }
          },
          1000
        );
    },

    updateHud() {
      document.querySelector(
        "#xrScore"
      ).setAttribute(
        "value",
        `Score: ${this.score}`
      );

      document.querySelector(
        "#xrTime"
      ).setAttribute(
        "value",
        `Time: ${this.timeLeft}`
      );

      const total =
        this.questionOrder.length ||
        QUESTIONS.length;

      document.querySelector(
        "#xrProgress"
      ).setAttribute(
        "value",
        `Question ${Math.min(this.q + 1, total)} / ${total}`
      );
    },

    showQuestion() {
      if (!this.running) {
        return;
      }

      if (
        this.q >=
        this.questionOrder.length
      ) {
        this.end(
          "Challenge complete!"
        );

        return;
      }

      this.locked = false;

      clearTimeout(
        this.fallTimer
      );

      clearCurrentXRHighlight();

      this.answerArea.innerHTML =
        "";

      this.feedback.setAttribute(
        "visible",
        false
      );

      const question =
        this.questionOrder[this.q];

      document.querySelector(
        "#xrQuestion"
      ).setAttribute(
        "value",
        question.question
      );

      const baseXs =
        [-0.55, 0, 0.55];

      for (
        let i = baseXs.length - 1;
        i > 0;
        i--
      ) {
        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          baseXs[i],
          baseXs[j]
        ] = [
          baseXs[j],
          baseXs[i]
        ];
      }

      const arrivals = [];

      question.answers.forEach(
        (answer, index) => {
          let hitbox;
          let holder;

          if (question.useModels) {
            const built =
              createXRModelAnswer(
                answer
              );

            holder =
              built.holder;

            hitbox =
              built.hitbox;

            hitbox.dataset.index =
              index;
          }

          else {
            const visibleCard =
              document.createElement(
                "a-box"
              );

            visibleCard.setAttribute(
              "width",
              XR_TARGET_WIDTH
            );

            visibleCard.setAttribute(
              "height",
              XR_TARGET_HEIGHT
            );

            visibleCard.setAttribute(
              "depth",
              "0.05"
            );

            visibleCard.setAttribute(
              "color",
              COLOURS.normal
            );

            /*
             * A-Frame's built-in font may
             * not render emoji reliably,
             * so simple geometry is used.
             */
            addXRIcon(
              visibleCard,
              answer.icon
            );

            const text =
              document.createElement(
                "a-text"
              );

            text.setAttribute(
              "value",
              answer.label
            );

            text.setAttribute(
              "align",
              "center"
            );

            text.setAttribute(
              "position",
              "0 -0.075 0.035"
            );

            text.setAttribute(
              "width",
              "0.70"
            );

            text.setAttribute(
              "wrap-count",
              "16"
            );

            visibleCard.appendChild(
              text
            );

            holder =
              document.createElement(
                "a-entity"
              );

            holder.appendChild(
              visibleCard
            );

            hitbox =
              attachAimAssist(
                holder,
                visibleCard,
                index
              );
          }

          const startX =
            baseXs[index] +
            randomBetween(
              -0.14,
              0.14
            );

          const startY =
            randomBetween(
              1.72,
              1.82
            );

          const endX =
            Math.max(
              -1.05,
              Math.min(
                1.05,
                startX +
                randomBetween(
                  -0.60,
                  0.60
                )
              )
            );

          const endY =
            randomBetween(
              -0.64,
              -0.48
            );

          const endZ =
            randomBetween(
              -0.22,
              0.14
            );

          const delay =
            randomBetween(
              0,
              MAX_DROP_DELAY_SECONDS
            );

          const duration =
            randomBetween(
              MIN_FALL_SECONDS,
              MAX_FALL_SECONDS
            );

          arrivals.push(
            delay + duration
          );

          holder.setAttribute(
            "position",
            `${startX} ${startY} 0`
          );

          this.answerArea.appendChild(
            holder
          );

          setTimeout(
            () => {
              if (
                !this.running ||
                this.locked
              ) {
                return;
              }

              holder.setAttribute(
                "animation__fall",
                `property: position; ` +
                `to: ${endX} ${endY} ${endZ}; ` +
                `dur: ${duration * 1000}; ` +
                `easing: linear`
              );

              holder.setAttribute(
                "animation__spin",
                `property: rotation; ` +
                `to: ${randomBetween(-18, 18)} ` +
                `${randomBetween(-28, 28)} ` +
                `${randomBetween(-12, 12)}; ` +
                `dur: ${duration * 1000}; ` +
                `easing: linear`
              );
            },
            delay * 1000
          );
        }
      );

      this.fallTimer =
        setTimeout(
          () => {
            this.missed();
          },
          Math.min(
            ...arrivals
          ) * 1000
        );

      this.updateHud();
    },

    choose(hitbox) {
      if (
        !this.running ||
        this.locked
      ) {
        return;
      }

      const index =
        Number(
          hitbox.dataset.index
        );

      const question =
        this.questionOrder[this.q];

      const answer =
        question.answers[index];

      const parent =
        hitbox.parentElement;

      const visibleCard =
        parent
          ? Array.from(
              parent.children
            ).find(
              (child) =>
                child.tagName &&
                child.tagName.toLowerCase() ===
                  "a-box" &&
                !child.classList.contains(
                  "shootable"
                )
            )
          : null;

      if (answer.correct) {
        this.locked = true;

        clearTimeout(
          this.fallTimer
        );

        this.score +=
          POINTS_CORRECT;

        if (visibleCard) {
          visibleCard.setAttribute(
            "color",
            COLOURS.correct
          );
        }

        audio.correct();

        this.showFeedback(
          `CORRECT +${POINTS_CORRECT}\n${question.explanation}`,
          COLOURS.correct
        );

        this.updateHud();

        setTimeout(
          () => {
            this.q++;
            this.showQuestion();
          },
          2100
        );
      }

      else {
        this.score +=
          POINTS_WRONG;

        hitbox.classList.remove(
          "shootable"
        );

        if (visibleCard) {
          visibleCard.setAttribute(
            "color",
            COLOURS.wrong
          );
        }

        audio.wrong();

        this.showFeedback(
          `WRONG ${POINTS_WRONG}\nTry another target.`,
          COLOURS.wrong
        );

        this.updateHud();
      }
    },

    missed() {
      if (
        !this.running ||
        this.locked
      ) {
        return;
      }

      this.locked = true;

      this.score +=
        POINTS_MISSED;

      audio.explode();

      this.updateHud();

      this.answerArea
        .querySelectorAll(
          ".shootable"
        )
        .forEach(
          (element) => {
            element.classList.remove(
              "shootable"
            );
          }
        );

      this.createExplosion();

      this.showFeedback(
        `TOO SLOW ${POINTS_MISSED}\nThe targets reached the ground.`,
        COLOURS.wrong
      );

      setTimeout(
        () => {
          this.q++;
          this.showQuestion();
        },
        1300
      );
    },

    createExplosion() {
      const explosion =
        document.createElement(
          "a-sphere"
        );

      explosion.setAttribute(
        "position",
        "0 -0.45 0"
      );

      explosion.setAttribute(
        "radius",
        "0.12"
      );

      explosion.setAttribute(
        "color",
        "#FFB300"
      );

      explosion.setAttribute(
        "material",
        "shader: flat; opacity: 0.9; transparent: true"
      );

      explosion.setAttribute(
        "animation__grow",
        "property: scale; to: 4 4 4; dur: 350; easing: easeOutQuad"
      );

      explosion.setAttribute(
        "animation__fade",
        "property: material.opacity; to: 0; dur: 400; easing: linear"
      );

      this.answerArea.appendChild(
        explosion
      );

      setTimeout(
        () => {
          explosion.remove();
        },
        450
      );
    },

    showFeedback(
      message,
      colour
    ) {
      this.feedback.setAttribute(
        "visible",
        true
      );

      this.feedback.setAttribute(
        "color",
        colour
      );

      document.querySelector(
        "#xrFeedbackText"
      ).setAttribute(
        "value",
        message
      );
    },

    stop() {
      if (!this.running) {
        return;
      }

      this.end(
        "Game stopped."
      );
    },

    async exitXR() {
      this.running = false;

      clearInterval(
        this.timer
      );

      clearTimeout(
        this.fallTimer
      );

      const scene =
        document.querySelector(
          "a-scene"
        );

      try {
        await scene.exitVR();
      }

      catch (error) {
        console.error(
          error
        );
      }

      document.querySelector(
        "#modeScreen"
      ).style.display =
        "flex";

      document.querySelector(
        "#modeStatus"
      ).textContent =
        "Exited XR. Choose a mode to play again.";
    },

    end(reason) {
      this.running = false;

      clearInterval(
        this.timer
      );

      clearTimeout(
        this.fallTimer
      );

      document.querySelector(
        "#xrQuizRoot"
      ).setAttribute(
        "visible",
        false
      );

      document.querySelector(
        "#xrGameOver"
      ).setAttribute(
        "visible",
        true
      );

      const elapsed =
        this.startTime
          ? Math.max(
              0,
              Math.round(
                (
                  performance.now() -
                  this.startTime
                ) /
                1000
              )
            )
          : 0;

      document.querySelector(
        "#xrGameOverReason"
      ).setAttribute(
        "value",
        reason
      );

      document.querySelector(
        "#xrGameOverScore"
      ).setAttribute(
        "value",
        `Your Score: ${this.score}`
      );

      document.querySelector(
        "#xrGameOverTime"
      ).setAttribute(
        "value",
        `Time Taken: ${elapsed} seconds`
      );
    }
  }
);

/* =========================================================
   QUEST CONTROLLER
   ========================================================= */

AFRAME.registerComponent(
  "xr-shooter",
  {
    init() {
      this.el.addEventListener(
        "triggerdown",
        () => {
          this.shoot();
        }
      );

      this.el.addEventListener(
        "abuttondown",
        () => {
          const game =
            document.querySelector(
              "#xrGameManager"
            ).components[
              "xr-quiz-game"
            ];

          if (
            game &&
            !game.running
          ) {
            game.start();
          }
        }
      );
    },

    shoot() {
      const game =
        document.querySelector(
          "#xrGameManager"
        ).components[
          "xr-quiz-game"
        ];

      const raycaster =
        this.el.components.raycaster;

      if (
        !raycaster ||
        !raycaster.intersections ||
        !raycaster.intersections.length
      ) {
        return;
      }

      const intersection =
        raycaster.intersections[0];

      const hit =
        intersection.object &&
        intersection.object.el;

      if (
        hit &&
        hit.id ===
          "xrExitButton"
      ) {
        audio.shoot();
        game.exitXR();
        return;
      }

      if (
        hit &&
        hit.id ===
          "xrStopButton"
      ) {
        audio.shoot();
        game.stop();
        return;
      }

      if (
        !game ||
        !game.running ||
        game.locked
      ) {
        return;
      }

      audio.shoot();

      if (
        hit &&
        hit.classList.contains(
          "shootable"
        )
      ) {
        game.choose(hit);
      }
    }
  }
);

/* =========================================================
   PAGE EVENTS
   ========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {
    detectMode();

    document.querySelector(
      "#pcButton"
    ).addEventListener(
      "click",
      () => {
        pc.start(
          "desktop"
        );
      }
    );

    document.querySelector(
      "#mobileButton"
    ).addEventListener(
      "click",
      () => {
        pc.start(
          "mobile"
        );
      }
    );

    document.querySelector(
      "#pcRestart"
    ).addEventListener(
      "click",
      () => {
        document.querySelector(
          "#pcGameOver"
        ).style.display =
          "none";

        pc.start(
          mobileMode
            ? "mobile"
            : "desktop"
        );
      }
    );

    document.querySelector(
      "#pcStop"
    ).addEventListener(
      "click",
      () => {
        pc.stop();
      }
    );

    const arena =
      document.querySelector(
        "#pcArena"
      );

    let mobilePointerDown =
      false;

    arena.addEventListener(
      "pointerdown",
      (event) => {
        if (
          !mobileMode ||
          !pc.running
        ) {
          return;
        }

        mobilePointerDown =
          true;

        if (
          arena.setPointerCapture
        ) {
          arena.setPointerCapture(
            event.pointerId
          );
        }

        setMobileCrosshairFromClient(
          event.clientX,
          event.clientY
        );

        event.preventDefault();
      }
    );

    arena.addEventListener(
      "pointermove",
      (event) => {
        if (
          !mobileMode ||
          !pc.running ||
          !mobilePointerDown
        ) {
          return;
        }

        setMobileCrosshairFromClient(
          event.clientX,
          event.clientY
        );

        event.preventDefault();
      }
    );

    arena.addEventListener(
      "pointerup",
      (event) => {
        if (!mobileMode) {
          return;
        }

        mobilePointerDown =
          false;

        event.preventDefault();
      }
    );

    arena.addEventListener(
      "pointercancel",
      () => {
        mobilePointerDown =
          false;
      }
    );

    document.querySelector(
      "#mobileShoot"
    ).addEventListener(
      "click",
      (event) => {
        event.preventDefault();

        if (
          !mobileMode ||
          !pc.running ||
          pc.locked
        ) {
          return;
        }

        updateMobileAim();

        if (
          currentMobileTarget &&
          currentMobileTarget.dataset.disabled !==
            "true"
        ) {
          audio.shoot();

          const index =
            Number(
              currentMobileTarget.dataset.index
            );

          pc.choose(
            index,
            currentMobileTarget
          );
        }

        else {
          const status =
            document.querySelector(
              "#mobileAimStatus"
            );

          if (status) {
            status.textContent =
              "Aim at a target first";
          }
        }
      }
    );

    document.querySelector(
      "#xrButton"
    ).addEventListener(
      "click",
      async () => {
        audio.init();

        try {
          document.querySelector(
            "#modeScreen"
          ).style.display =
            "none";

          await document.querySelector(
            "a-scene"
          ).enterAR();
        }

        catch (error) {
          document.querySelector(
            "#modeScreen"
          ).style.display =
            "flex";

          document.querySelector(
            "#modeStatus"
          ).textContent =
            "Could not start WebXR. You can still use the desktop or mobile version.";

          console.error(
            error
          );
        }
      }
    );
  }
);
</script>
</head>

<body>

<!-- =======================================================
     START SCREEN
     ======================================================= -->

<div id="modeScreen">
  <div class="card">
    <h1 id="modeTitle">
      MHA Safety Challenge
    </h1>

    <p id="modeDescription">
      Checking whether this browser supports mixed reality...
    </p>

    <button
      id="xrButton"
      type="button"
      style="display:none"
    >
      Enter Mixed Reality
    </button>

    <button
      id="mobileButton"
      type="button"
      style="display:none"
    >
      Play Mobile Touch Version
    </button>

    <button
      id="pcButton"
      type="button"
      style="display:none"
    >
      Play Personal Computer Version
    </button>

    <div
      id="modeStatus"
      style="margin-top:16px;color:#cbd5e1"
    ></div>
  </div>
</div>

<!-- =======================================================
     DESKTOP / MOBILE GAME
     ======================================================= -->

<div id="pcGame">

  <div id="pcControls">
    <button
      id="pcStop"
      type="button"
      class="xr-control"
    >
      Stop Game
    </button>
  </div>

  <div id="pcHud">

    <div id="pcQuestion">
      Question
    </div>

    <div id="pcStats">
      <span id="pcProgress">
        Question 1 / 6
      </span>

      <span id="pcScore">
        Score: 0
      </span>

      <span id="pcTime">
        Time: 60
      </span>
    </div>

  </div>

  <div id="pcArena"></div>

  <!-- Mobile-only aiming controls -->
  <div id="mobileControls">

    <div id="mobileRay"></div>

    <div id="mobileCrosshair">
      <div id="mobileCrosshairDot"></div>
    </div>

    <div id="mobileHint">
      Drag anywhere to aim.
      <span id="mobileAimStatus">
        No target selected
      </span>
    </div>

    <button
      id="mobileShoot"
      type="button"
    >
      SHOOT
    </button>

  </div>

  <div id="pcFeedback"></div>

  <div id="pcGameOver">
    <div class="card">

      <h1>
        Challenge Complete
      </h1>

      <p id="pcGameOverText"></p>

      <button
        id="pcRestart"
        type="button"
      >
        Restart
      </button>

    </div>
  </div>

</div>

<!-- =======================================================
     WEBXR / META QUEST SCENE
     ======================================================= -->

<a-scene
  style="display:block"
  xr-mode-ui="XRMode: ar"
  renderer="alpha: true; colorManagement: true; antialias: true"
  background="transparent: true"
  webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor"
>

  <a-camera
    wasd-controls-enabled="false"
  ></a-camera>

  <!-- Lighting for imported GLB models -->

  <a-light
    type="ambient"
    color="#FFFFFF"
    intensity="1.5"
  ></a-light>

  <a-light
    type="directional"
    color="#FFFFFF"
    intensity="1.8"
    position="-1 3 2"
  ></a-light>

  <a-light
    type="directional"
    color="#FFFFFF"
    intensity="0.8"
    position="2 2 1"
  ></a-light>

  <!-- Quest controllers -->

  <a-entity
    id="leftController"
    meta-touch-controls="hand: left"
  ></a-entity>

  <a-entity
    id="rightController"
    meta-touch-controls="hand: right"
    raycaster="objects: .shootable, .xrUtility; far: 6; showLine: true; lineColor: #22D3EE; lineOpacity: 0.95"
    xr-shooter
  ></a-entity>

  <!-- Game manager -->

  <a-entity
    id="xrGameManager"
    xr-quiz-game
  ></a-entity>

  <!-- =====================================================
       XR STOP / EXIT CONTROLS
       ===================================================== -->

  <a-entity
    id="xrControls"
    position="0 2.78 -2.5"
  >

    <a-box
      id="xrStopButton"
      class="xrUtility"
      width="0.58"
      height="0.18"
      depth="0.04"
      position="-0.32 0 0"
      color="#B91C1C"
    >

      <a-text
        value="STOP GAME"
        position="0 0 0.03"
        width="0.95"
        align="center"
      ></a-text>

    </a-box>

    <a-box
      id="xrExitButton"
      class="xrUtility"
      width="0.58"
      height="0.18"
      depth="0.04"
      position="0.32 0 0"
      color="#475569"
    >

      <a-text
        value="EXIT XR"
        position="0 0 0.03"
        width="0.95"
        align="center"
      ></a-text>

    </a-box>

  </a-entity>

  <!-- =====================================================
       XR QUIZ
       ===================================================== -->

  <a-entity id="xrQuizRoot">

    <!-- Question panel -->

    <a-entity
      position="0 2.25 -2.7"
    >

      <a-box
        width="2.75"
        height="0.56"
        depth="0.045"
        color="#0F172A"
        opacity="0.94"
      ></a-box>

      <a-text
        id="xrQuestion"
        value="Question"
        position="0 0.07 0.04"
        width="2.35"
        align="center"
        wrap-count="48"
      ></a-text>

      <a-text
        id="xrProgress"
        value="Question 1 / 6"
        position="-1.12 -0.18 0.04"
        width="1.05"
        color="#93C5FD"
      ></a-text>

      <a-text
        id="xrScore"
        value="Score: 0"
        position="0.35 -0.18 0.04"
        width="0.95"
      ></a-text>

      <a-text
        id="xrTime"
        value="Time: 60"
        position="0.85 -0.18 0.04"
        width="0.95"
        color="#FACC15"
      ></a-text>

    </a-entity>

    <!-- Dynamically generated answers -->

    <a-entity
      id="xrAnswerArea"
      position="0 0 -2.7"
    ></a-entity>

    <!-- Feedback -->

    <a-box
      id="xrFeedback"
      position="0 0.42 -2.55"
      width="3.0"
      height="0.5"
      depth="0.04"
      color="#16A34A"
      visible="false"
    >

      <a-text
        id="xrFeedbackText"
        value=""
        position="0 0 0.03"
        width="2.7"
        align="center"
        wrap-count="48"
      ></a-text>

    </a-box>

  </a-entity>

  <!-- =====================================================
       XR GAME OVER
       ===================================================== -->

  <a-entity
    id="xrGameOver"
    position="0 1.5 -2.3"
    visible="false"
  >

    <a-box
      width="2.9"
      height="1.55"
      depth="0.06"
      color="#111827"
      opacity="0.96"
    ></a-box>

    <a-text
      value="CHALLENGE COMPLETE"
      position="0 0.48 0.04"
      width="3.1"
      align="center"
      color="#FACC15"
    ></a-text>

    <a-text
      id="xrGameOverReason"
      value=""
      position="0 0.17 0.04"
      width="2.4"
      align="center"
      color="#BFDBFE"
    ></a-text>

    <a-text
      id="xrGameOverScore"
      value="Your Score: 0"
      position="0 -0.06 0.04"
      width="2.8"
      align="center"
    ></a-text>

    <a-text
      id="xrGameOverTime"
      value="Time Taken: 0 seconds"
      position="0 -0.27 0.04"
      width="2.4"
      align="center"
      color="#BFDBFE"
    ></a-text>

    <a-text
      value="Press A on the right controller to restart"
      position="0 -0.50 0.04"
      width="2.4"
      align="center"
      color="#67E8F9"
      wrap-count="38"
    ></a-text>

  </a-entity>

</a-scene>

</body>
</html>
